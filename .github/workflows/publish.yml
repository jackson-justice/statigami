# Render the Quarto site in website/ and publish it to the gh-pages branch
# whenever site content, brand files or project figures change on main.
# Articles marked `draft: true` are left out of the published site.

name: Publish website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "brand/**"
      - "*/figures/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pre-render script (website/scripts/prepare-site.ts) runs on
      # Quarto's bundled Deno, so Quarto is the only thing to install
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
