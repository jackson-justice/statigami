<div class="sg-progress" aria-hidden="true"></div>
<script>
// Reading-progress bar that heats up (cobalt -> magenta -> amber) as the
// reader gets through an article
(() => {
  const content = document.querySelector("#quarto-document-content");
  const bar = document.querySelector(".sg-progress");
  if (!content || !document.body.classList.contains("sg-article")) return;
  bar.classList.add("is-on");
  const update = () => {
    const start = content.offsetTop;
    const span = content.offsetHeight - window.innerHeight;
    const p = Math.min(1, Math.max(0, (window.scrollY - start) / Math.max(span, 1)));
    bar.style.transform = `scaleX(${p})`;
    bar.dataset.heat = p < 1 / 3 ? "cool" : p < 2 / 3 ? "mid" : "hot";
  };
  addEventListener("scroll", update, { passive: true });
  addEventListener("resize", update);
  update();
})();
</script>
