project:
  type: website
  output-dir: _site
  # Copies figures from project folders and builds the brand
  # styles/logo (generated, git-ignored) before every render
  pre-render: scripts/prepare-site.ts

website:
  title: "Statigami"
  # Articles with `draft: true` are not published at all (Quarto's default,
  # "unlinked", would still publish the page at its URL)
  draft-mode: gone
  description: "Sports stats, folded into stories."
  navbar:
    logo: assets/brand/logo.svg
    left:
      - href: index.qmd
        text: Home
      - href: articles.qmd
        text: Articles
      - href: about.qmd
        text: About

format:
  html:
    theme:
      - cosmo
      - assets/brand/_brand.scss
    toc: true
    toc-title: "Contents"
    fig-cap-location: bottom
    link-external-newwindow: true
